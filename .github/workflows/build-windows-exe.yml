name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/5cea4036-demo5type"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6,<7"

      - name: Build single-file console app
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name demo5type --paths . scripts/demo5type_cli.py

      - name: Smoke-test executable
        run: .\dist\demo5type.exe

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\demo5type.exe).Hash.ToLowerInvariant()
          Set-Content -Path .\dist\demo5type.exe.sha256 -Value "$hash  demo5type.exe" -Encoding ascii
          Write-Host $hash

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: demo5type-windows-x64
          path: |
            dist/demo5type.exe
            dist/demo5type.exe.sha256
          if-no-files-found: error
          retention-days: 14

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo5type"
version = "0.1.0"
description = "Framework-independent behavior prototype for a humanoid simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "demo5type contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["demo5type*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
